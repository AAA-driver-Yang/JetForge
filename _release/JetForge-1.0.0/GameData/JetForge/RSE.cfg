// RocketSoundEnhancement（RSE）适配补丁。
//
// 为什么自己写这一份，而不是让 RSE 像对原版喷气那样直接认零件：
//   RSE 只对 Configs/Squad/Jet-Engines.cfg 里列名的零件打补丁（turboFanSize2 / JetEngine /
//   miniJetEngine…），JetForgeEngine 不在名单里，所以它不会给我们挂模块。
//
// 为什么声音组必须叫 JetForge：
//   RSE_Engines.OnStart 的流程是「拿本零件 ModuleEngines 的 engineID 去 SoundLayerGroups 里取组」，
//   取不到就抛 KeyNotFoundException，整个模块死在 OnStart，一个音都不放。本零件的 engineID
//   是 JetForge（见 Parts/JetForgeEngine.cfg），所以组名必须一字不差。
//
// 分工：RSE 在放声时，我们自己那九层（Source/FX/JetForgeSound.cs）**整套静音**，
// 只当"没装 RSE"时的后备。加力两层（AB_Roar / AB_Screech）搬到这里，用我们自己的
// Sounds/jf_ab_* ——RSE 原版喷气的声音组里没有加力层，所以上一版绕开 RSE 自己播，
// 玩家一句"还是有部分声音没被 RSE 处理"就点破了：它没有空气吸收、没有多普勒，
// 也不跟转速走，只在两种响度之间跳。
//
// 加力层的横轴是**推力分数**（RSE 的 x = GetCurrentThrust/maxThrust，反汇编确认），
// 不是加力比例——RSE 不知道"加力开没开"。所以用高分位门槛模拟：一台加力机器干态满油门
// 只到 0.7 上下，加力点着才压到 1.0 附近。没有加力燃烧室的设计，这两层会在运行时被按到
// 零音量（JetForgeSound.PushVoiceToRse 里 IsAbLayer 那一段）。
//
// 注意：这个文件是**源**。构建时 csproj 的 CopyToGameData 会把 JetForge/GameData/JetForge/**
// 覆盖到 KSP 安装目录，直接改安装目录那份会被下一次构建冲掉。
@PART[JetForgeEngine]:NEEDS[RocketSoundEnhancement]
{
	MODULE
	{
		name = RSE_Engines
		volume = 1.0

		AIRSIMULATION
		{
			AngleHighpass = 300
			MaxCombMix = 0.25
		}

		SOUNDLAYERGROUP
		{
			name = JetForge

			SOUNDLAYER
			{
				name = Turbine_Air
				audioClip = RocketSoundEnhancementDefault/Sounds/JetsTurbines/Turbine_Air
				loop = true
				spread = 0.4

				volumeFC
				{
					key = 0 0 0 0
					key = 0.5 1.0 0 0
				}

				pitchFC
				{
					key = 0 0.6
					key = 1 0.7
				}
			}

			SOUNDLAYER
			{
				name = Turbofan_Resonance-250hz
				audioClip = RocketSoundEnhancementDefault/Sounds/JetsTurbines/Turbofan_Resonance-250hz
				loop = true
				spread = 0.4
				spool = true
				spoolSpeed = 0.12
				data = Turbine

				volumeFC
				{
					key = 0 0 0 0
					key = 0.25 1.3 0 0
					key = 0.5 0.33 0 0
					key = 1.0 0.68 0 0
				}

				pitchFC
				{
					key = 0 0.25
					key = 1 2.75
				}
			}

			SOUNDLAYER
			{
				name = Turbofan_Resonance-50hz
				audioClip = RocketSoundEnhancementDefault/Sounds/JetsTurbines/Turbofan_Resonance-50hz
				loop = true
				spread = 0.4
				spool = true
				spoolSpeed = 0.12
				data = Turbine

				volumeFC
				{
					key = 0 0 0 0
					key = 0.5 1.3 0 0
				}

				pitchFC
				{
					key = 0 0.25
					key = 1 0.75
				}
			}

			SOUNDLAYER
			{
				name = Turbine_Big-180hz
				audioClip = RocketSoundEnhancementDefault/Sounds/JetsTurbines/Turbine_Big-180hz
				loop = true
				spread = 0.4
				spool = true
				spoolIdle = 0.5
				spoolSpeed = 0.06
				data = Turbine

				volumeFC
				{
					key = 0 0 0 0
					key = 0.1 0.68 0 0
					key = 0.5 0.68 0 0
					key = 1 0.34 0 0
				}

				pitchFC
				{
					key = 0 0.1 0 1.8
					key = 0.5 1 1.8 3.5
					key = 1 3.75 5.5 0
				}
			}

			SOUNDLAYER
			{
				name = Turbine_Air-2
				audioClip = RocketSoundEnhancementDefault/Sounds/JetsTurbines/Turbine_Air-2
				loop = true
				spread = 0.4
				spool = true
				spoolIdle = 0.5
				spoolSpeed = 0.06
				data = Turbine

				volumeFC
				{
					key = 0 0 0 0
					key = 0.5 0.68 0 0
				}

				pitchFC
				{
					key = 0 0.5 0 1
					key = 0.5 1 1 0.2
					key = 1 1.1 0.2 0
				}
			}

			SOUNDLAYER
			{
				name = Turbine_Whine-2.1khz
				audioClip = RocketSoundEnhancementDefault/Sounds/JetsTurbines/Turbine_Whine-2.1khz
				loop = true
				spread = 0.4
				spool = true
				spoolSpeed = 0.12
				spoolIdle = 0.5
				data = Turbine

				volumeFC
				{
					key = 0 0 0 0
					key = 0.1 0.75 0 0
				}

				pitchFC
				{
					key = 0 0.12 0.86 0.86
					key = 0.5 0.55 0.86 0.8
					key = 1 0.95 0.8 0.8
				}
			}

			SOUNDLAYER
			{
				name = AB_Roar
				audioClip = JetForge/Sounds/jf_ab_roar
				loop = true
				spread = 0.4

				volumeFC
				{
					key = 0 0 0 0
					key = 0.70 0 0 0
					key = 0.88 0.85 0 0
					key = 1 1 0 0
				}

				pitchFC
				{
					key = 0 0.86 0 0
					key = 1 1.12 0 0
				}
			}

			SOUNDLAYER
			{
				name = AB_Screech
				audioClip = JetForge/Sounds/jf_ab_screech
				loop = true
				spread = 0.4

				volumeFC
				{
					key = 0 0 0 0
					key = 0.74 0 0 0
					key = 0.90 0.22 0 0
					key = 1 0.38 0 0
				}

				pitchFC
				{
					key = 0 0.98 0 0
					key = 1 1.22 0 0
				}
			}
		}

		Engage
		{
			SOUNDLAYER
			{
				name = Engage
				audioClip = RocketSoundEnhancementDefault/Sounds/Engines/Liquid_Ignition-1
				spread = 0.25
				volume = 1.0
				pitch = 1.0
			}
		}

		Flameout
		{
			SOUNDLAYER
			{
				name = FlameOut
				audioClip = RocketSoundEnhancementDefault/Sounds/Engines/Liquid_Burst-1
				audioClip = RocketSoundEnhancementDefault/Sounds/Engines/Liquid_Burst-2
				audioClip = RocketSoundEnhancementDefault/Sounds/Engines/Liquid_Burst-3
				spread = 0.5
				volume = 0.75
				pitch = 0.5
			}
		}
	}
}
