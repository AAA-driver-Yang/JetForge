PART
{
	name = JetForgeIntake
	module = Part
	author = JetForge

	// 外形由插件生成：飞行/机库里 `RefreshIntakeMesh()` 按面板上的截面型线放样出
	// 外罩、中心体、内壁、唇口四组网格，并把原版这个模型的 MeshRenderer 关掉
	// （`MeshBuilder.HideOriginals`）。
	// 留着这条 MODEL 是为了三件事：①零件加载那一刻（型线还没量、网格还没建）得有东西，
	// 否则零件在 VAB 里是隐形的；②碰撞体与节点定位借它的尺寸；③型线读不出来时兜底。
	// 也就是说：玩家看到的不是它。
	MODEL
	{
		model = Squad/Parts/Aero/circularIntake/CircularIntake
		scale = 1.0, 1.0, 1.0
	}
	rescaleFactor = 1

	// 节点按缺省尺（捕获 Ø0.6 m、长 0.5 m）给。改捕获直径不会动节点——
	// 与发动机同样的 KSP 硬约束（节点在 cfg 里是静态的）。
	node_stack_top = 0.0, 0.25, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0.0, -0.25, 0.0, 0.0, -1.0, 0.0, 1
	node_attach = 0.0, 0.0, -0.35, 0.0, 0.0, 1.0, 1

	TechRequired = aerodynamicSystems
	entryCost = 4000
	cost = 900
	category = Aero
	subcategory = 0
	title = #autoLOC_JF_intake_title
	manufacturer = JetForge
	description = #autoLOC_JF_intake_desc
	attachRules = 1,0,1,0,0
	mass = 0.10
	heatConductivity = 0.06
	skinInternalConductionMult = 4.0
	emissiveConstant = 0.8
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 1.5
	crashTolerance = 8
	maxTemp = 2400
	fuelCrossFeed = False
	bulkheadProfiles = size1
	tags = intake inlet jet aero 进气道 进气 自定义

DRAG_CUBE
	{
		cube = Default, 0.36,0.72,0.42, 0.36,0.72,0.42, 0.34,0.34,0.62, 0.34,0.98,0.12, 0.36,0.72,0.42, 0.36,0.72,0.42, 0,-0.25,0, 0.62,0.55,0.62
	}

	MODULE
	{
		name = ModuleJetForgeIntake
		intakeName = JF 进气道
		// 出口（发动机面）直径。0 = 按这件自己的喉道反推，
		// 填了就是"我要把 Ø0.6 的气送到 Ø1.2 的发动机面"这种转接。
		exitDiameter = 0
		// 技术代决定进气道恢复系数的年代基准（与发动机设计器同一套）。
		techName = 1970s
	}
}