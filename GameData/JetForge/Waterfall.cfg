// JetForge × Waterfall：给自定义发动机挂原版那套羽流。
//
// 为什么写在这而不是运行时拿 AddModule 现造：
// Part.AddModule(ConfigNode, forceAwake) 在游戏里返回 null（实测，"造模块：失败（AddModule
// 返回空）"）。cfg 里静态声明模块是 KSP 唯一稳的路，而且每个零件实例会各自克隆一份模块，
// 所以"每台发动机的羽流尺寸不同"仍然成立——尺寸由 JetForgeWaterfall.cs 按这台机器的喷口
// 半径改写 TemplateScaleOffset。
//
// 九套模板，靠"构型 × 加力温度"分工（温度取这台机自己的 Afterburner.ExitTemp）：
//   jetforge_dry_low      低涵道 / 涡喷干态
//   jetforge_dry_high     高涵道（BPR > 2.5）干态——羽流近不可见、更淡
//   jetforge_dry_old      早期涡喷干态（1940s 技术级）——偏琥珀灰、带烟
//   jetforge_wet_jet_warm 涡喷加力，T7 < 1850 K
//   jetforge_wet_jet_mid  涡喷加力，1850~2000 K
//   jetforge_wet_jet_hot  涡喷加力，> 2000 K——蓝白核心
//   jetforge_wet_fan_warm 涡扇加力，T7 < 1900 K
//   jetforge_wet_fan_mid  涡扇加力，1900~2050 K
//   jetforge_wet_fan_hot  涡扇加力，> 2050 K——蓝紫白
//
// 曲线：WaterfallTemplates.cfg 里的模板是"加力比例 0→1"的 domain，不是 KSP 油门。
// 运行时由 JetForgeWaterfall 通过 WaterfallController.SetOverride 把
// 干态 = 油门 ×（1−0.85·加力比例）、湿态 = 加力比例 灌进去：
//   · 加力没点亮时湿羽流强度真的是 0（原版模板是油门过 0.699 就跳，这就是"70% 以下起火"）；
//   · 加力爬升时干羽流同步收掉，两套叠着过渡，不会出现"啪一下换一根"。
//
// scale 里的 1,1,1 只是占位，运行时会按喷口半径覆盖。
@PART[JetForgeEngine]:NEEDS[Waterfall]:AFTER[JetForge]
{
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = jetforge_dry_low
		engineID = basicEngine

		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = basicEngine
		}
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = random1
			linkedTo = random
			noiseType = perlin
			scale = 0.6
			minimum = -0.3
			speed = 8
			seed = 17
		}

		TEMPLATE
		{
			templateName = JetForge-Dry-LowBypass
			overrideParentTransform = JetForgeThrust
			position = 0,0,0
			rotation = 0,0,0
			scale = 1,1,1
		}
	}

	MODULE
