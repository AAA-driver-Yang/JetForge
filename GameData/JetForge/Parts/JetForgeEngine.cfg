PART
{
	name = JetForgeEngine
	module = Part
	author = JetForge
	MODEL
	{
		model = Squad/Parts/Engine/jetEngines/turboFanSize1
		scale = 1.0, 1.0, 1.0
	}
	rescaleFactor = 1
	// 节点位置按默认设计（长度 3.0 m）钉死；改长度后外形会变，但节点不会跟着动——
	// 这是 KSP 的硬约束（节点在 cfg 里是静态的）。要动态节点得靠插件改 attachNodes。
	node_stack_top = 0.0, 1.5, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0.0, -1.5, 0.0, 0.0, -1.0, 0.0, 1
	node_attach = 0.0, 0.0, -0.5, 0.0, 0.0, 1.0, 1
	TechRequired = aerodynamicSystems
	entryCost = 12000
	cost = 3200
	category = Engine
	subcategory = 0
	title = #autoLOC_JF_engine_title
	manufacturer = JetForge
	description = #autoLOC_JF_engine_desc
	attachRules = 1,0,1,0,0
	mass = 1.4
	heatConductivity = 0.06
	skinInternalConductionMult = 4.0
	emissiveConstant = 0.8
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 7
	maxTemp = 2200
	bulkheadProfiles = size1
	tags = jet turbine turbofan turbojet engine custom 喷气 涡扇 涡喷 自定义

MODULE
	{
		name = ModuleJetForgeEngine
		engineID = JetForge

		thrustVectorTransformName = thrustTransform
		exhaustDamage = True
		exhaustDamageMultiplier = 5
		ignitionThreshold = 0.05
		minThrust = 0
		// 千牛。运行时会被设计点覆盖，这里的值只为加载阶段有个合理数
		maxThrust = 82
		heatProduction = 60
		// 油门滞后由我们自己的 Core/Spool.cs 负责，原版的响应时间必须关掉：
		// 两套滞后叠在一起，玩家看到的就是"推油门十秒才反应"。
		useEngineResponseTime = False
		engineAccelerationSpeed = 0.10
		engineDecelerationSpeed = 0.45
		EngineType = Turbine
		clampPropReceived = True

		// 只烧 LiquidFuel。
		// 原版把 requestedMassFlow 按各 PROPELLANT 的 ratio 拆开（ratioSum 在加载时算好，
		// 飞行中改 ratio 不会重算），所以一旦混进 IntakeAir，燃油实际只拿到 1/128，
		// 油耗就和我们的模型对不上了。推进剂流量的口径统一成"燃油流量"，
		// 进气量由气动模型自己算，不走资源系统（进气道那一期再接回来）。
		PROPELLANT
		{
			name = LiquidFuel
			resourceFlowMode = STAGE_STACK_FLOW_BALANCE
			ratio = 1
			DrawGauge = True
		}

		atmosphereCurve
		{
			key = 0 7200 0 0
			key = 1 7000 0 0
		}

		// 这些曲线原版会用来算流量与推力；我们把推力整个接管了，
		// 但流量相关的字段还得留在合理范围，否则进气道会误报"缺气"。
		atmChangeFlow = True
		useVelCurve = False
		useAtmCurve = False
		flameoutBar = 0.02
		flowCapMult = 1.0
		// 原版给喷气发动机的这个字段是**熄火上限**：原版模块超了会置 `flameout`，
		// 而我们的飞行循环读的就是同一个 `flameout` 字段（`ModuleJetForgeEngine`
		// 的 `flameoutNow = flameout || …`）——填小了，整台机器就多一个不是我们算出来的天花板。
		// 原版喷气件的取值正好等于它们的速度包线：基础型 0.85、加力型 1.75、涡喷 2.5。
		// 本模组的预设能飞到 Ma 2.2~2.5，旧值 1.6 比原版涡喷还低，属于没想清楚就填的数。
		// 真正的上限由我们的模型自己管（T4/T7 超温、进气总温、进气道未起动、材料年代），
		// 这里只留一个远高于任何设计包线的门限，让判据由我们给。
		machLimit = 6.0
		machHeatMult = 25

		// JetForge 自己的参数
		autoRebuild = True
		gridBuildBudgetSeconds = 1.5

		// 默认设计：2 轴涡扇，与内核回归测试里的 JF-1 同一台
		JETFORGE_DESIGN
		{
			name = JF-1
			kind = Turbofan
			tech = 1970s
			inletDiameter = 1.200000
			length = 3.000000
			coreInletDiameter = 0.000000
			shaftCount = 2
			designMach = 0.000000
			designAlt = 0.000000
			overrideBpr = 0.000000
			nozzle = Converging

			FAN
			{
				diameter = 1.200000
				stages = 1
				hubTip = 0.420000
				pressureRatio = 0.000000
				shaft = 1
			}
			LPC
			{
				stages = 2
				tipDiameter = 0.620000
				hubTip = 0.620000
				psiScale = 1.000000
				shaft = 1
			}
			HPC
			{
				stages = 8
				tipDiameter = 0.500000
				hubTip = 0.700000
				psiScale = 1.000000
				shaft = 2
			}
			HPT
			{
				stages = 1
				tipDiameter = 0.550000
				psiScale = 1.000000
				shaft = 2
			}
			IPT
			{
				stages = 0
				tipDiameter = 0.580000
				psiScale = 1.000000
				shaft = 2
			}
			LPT
			{
				stages = 3
				tipDiameter = 0.620000
				psiScale = 1.000000
				shaft = 1
			}
			BURNER
			{
				kind = Annular
				length = 0.400000
				exitTemp = 1500.000000
				dpRatio = -1.000000
				etaComb = -1.000000
			}
			AFTERBURNER
			{
				enabled = False
				exitTemp = 1900.000000
				fuelRatio = 0.000000
				kind = Ring
			}
		}
	}
}