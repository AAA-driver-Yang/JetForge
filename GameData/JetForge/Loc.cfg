// JetForge 语言覆盖 / language override
//
// 界面语言默认跟着游戏走：游戏是中文就中文，是英文就英文。
// 这里可以强制指定，用于截图、录视频、或游戏语言没装对时救急。
//
// UI language follows the game. This file can force it — handy for
// screenshots, videos, or when the game language is not what you expect.
//
// 取值 / values: zh = 中文, en = English。留空或删掉这一行 = 跟随游戏。
// Empty or missing = follow the game.

JETFORGE_LOC
{
    // 随包缺省留空 = 跟随游戏。要截图或录英文视频就把下一行改成 forceLang = en。
    // Shipped default: empty = follow the game. Uncomment to force English.
    // forceLang = en
}