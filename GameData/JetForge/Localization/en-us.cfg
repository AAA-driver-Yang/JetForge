// 英文词条。KSP 的本地化是**全局表**：键写在这里，cfg 里用 #autoLOC_ 引用。
// 第一版把 Localization 节点写在 PART 里面，游戏里零件名直接显示成 #autoLOC_JF_engine_title
// ——自检那一行当场抓到。挪到这里才对：KSP 只从 GameData/<mod>/Localization/*.cfg 收词条。
Localization
{
	en-us
	{
		#autoLOC_JF_a_afterburner = Afterburner
		#autoLOC_JF_a_afterburner_switch = afterburner switch
		#autoLOC_JF_e_intake_designer = Intake designer
		#autoLOC_JF_e_open_designer = Engine designer
		#autoLOC_JF_e_rebuild_grid = Rebuild performance grid
		#autoLOC_JF_engine_desc = A parametrically designed turbojet/turbofan. Right-click to open the Engine Designer: fan, compressors, turbine, combustor, afterburner and nozzle are all adjustable, and performance is solved by a one-dimensional thermodynamic model as you type. Every engine gets its own mesh generated from its geometry.
		#autoLOC_JF_engine_title = JF-1 Procedural Jet Engine
		#autoLOC_JF_f_afterburner = Afterburner:
		#autoLOC_JF_f_afterburner_auto = Afterburner: auto
		#autoLOC_JF_f_afterburner_mode = afterburner mode
		#autoLOC_JF_f_afterburner_not_fitted = Afterburner: not fitted
		#autoLOC_JF_f_bypass_ratio_bpr = Bypass ratio BPR
		#autoLOC_JF_f_control = control
		#autoLOC_JF_f_cost = Cost
		#autoLOC_JF_f_defect = Defect
		#autoLOC_JF_f_defect_ledger = Defect ledger
		#autoLOC_JF_f_dry_mass = Dry mass
		#autoLOC_JF_f_fuel_air_ratio = Fuel/air ratio
		#autoLOC_JF_f_fuel_flow = Fuel flow
		#autoLOC_JF_f_heat_damage = heat damage
		#autoLOC_JF_f_idle_setting = idle setting
		#autoLOC_JF_f_intake_flow = Intake flow
